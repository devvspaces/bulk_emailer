name: Build application

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Machine to build for'
        required: true
        type: choice
        default: 'macos-arm64'
        options:
          - windows
          - macos-arm64
          - macos-intel
          - linux

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    if: matrix.target == inputs.target
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            os: windows-latest
          - target: macos-arm64
            os: macos-latest
          - target: macos-intel
            os: macos-13
          - target: linux
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Create runtime directories
        working-directory: src
        run: python -c "import os; [os.makedirs(d, exist_ok=True) for d in ('logs', 'media', 'static')]"

      - name: Build executable
        working-directory: src
        run: pyinstaller --clean --noconfirm bulk_emailer.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bulk_emailer-${{ matrix.target }}
          path: src/dist/*
