name: Build application

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Machine to build for'
        required: true
        type: choice
        default: 'macos-arm64'
        options:
          - windows
          - macos-arm64
          - macos-intel
          - linux

jobs:
  windows:
    if: inputs.target == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Create runtime directories
        working-directory: src
        run: python -c "import os; [os.makedirs(d, exist_ok=True) for d in ('logs', 'media', 'static')]"

      - name: Build executable
        working-directory: src
        run: pyinstaller --clean --noconfirm bulk_emailer.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bulk_emailer-windows
          path: src/dist/*

  macos-arm64:
    if: inputs.target == 'macos-arm64'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Create runtime directories
        working-directory: src
        run: python -c "import os; [os.makedirs(d, exist_ok=True) for d in ('logs', 'media', 'static')]"

      - name: Build executable
        working-directory: src
        run: pyinstaller --clean --noconfirm bulk_emailer.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bulk_emailer-macos-arm64
          path: src/dist/*

  macos-intel:
    if: inputs.target == 'macos-intel'
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Create runtime directories
        working-directory: src
        run: python -c "import os; [os.makedirs(d, exist_ok=True) for d in ('logs', 'media', 'static')]"

      - name: Build executable
        working-directory: src
        run: pyinstaller --clean --noconfirm bulk_emailer.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bulk_emailer-macos-intel
          path: src/dist/*

  linux:
    if: inputs.target == 'linux'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Create runtime directories
        working-directory: src
        run: python -c "import os; [os.makedirs(d, exist_ok=True) for d in ('logs', 'media', 'static')]"

      - name: Build executable
        working-directory: src
        run: pyinstaller --clean --noconfirm bulk_emailer.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bulk_emailer-linux
          path: src/dist/*
